name: post-carousel
on:
  push:
    paths: ["incoming_posts/**"]
  workflow_dispatch:
concurrency: post-reel
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post carousels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ID: ${{ secrets.THREADS_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHA: ${{ github.sha }}
        run: python3 scripts/post_posts.py
      - name: Commit logs and state
        if: always()
        run: |
          git config user.name "reel-poster"
          git config user.email "reel-poster@users.noreply.github.com"
          git add -A incoming_posts publish_log state
          git diff --cached --quiet || (git commit -m "publish log" && git pull --rebase && git push)
